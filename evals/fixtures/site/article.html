<h1>社区图书角下周一正式开放</h1>
<p>经过两个月的筹备，位于社区活动中心二楼的图书角将于下周一正式向居民开放。图书角目前藏书约一千二百册，以儿童绘本、生活百科和本地历史读物为主。</p>
<p>开放时间为每周二至周日上午九点到晚上八点，周一闭馆整理。居民凭社区卡可免费借阅，每人每次最多借三本，借期两周。</p>
<p>图书角还欢迎居民捐赠闲置书籍，捐书满五本可获得一张社区咖啡券。志愿者招募同步进行，每周服务四小时即可报名。</p>
